name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax & Compilation Check
        run: |
          python -m compileall audiobook_tts/
          python -m compileall qwen_tts/

      - name: Validate Web Assets
        run: |
          test -f web/index.html
          test -f assets/banner.svg
