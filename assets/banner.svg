<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <!-- Dark obsidian gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Vibrant cyan-to-violet gradient -->
    <linearGradient id="audio-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#8E2DE2"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#92FE9D"/>
    </linearGradient>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="240" rx="16" fill="url(#banner-bg)" stroke="#1a2236" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="120" cy="120" r="90" fill="#4facfe" opacity="0.08" filter="url(#subtle-glow)" />
  <circle cx="780" cy="120" r="100" fill="#8e2de2" opacity="0.06" filter="url(#subtle-glow)" />

  <!-- Logo Mark: Book + Waveform fusion -->
  <g transform="translate(68, 70)">
    <!-- Open Book Pages (Left & Right Wings) -->
    <path d="M 10 75 Q 40 68 70 76 L 70 20 Q 40 12 10 20 Z" fill="none" stroke="url(#audio-wave-grad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 78 76 Q 108 68 138 75 L 138 20 Q 108 12 78 20 Z" fill="none" stroke="url(#audio-wave-grad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Spine Center -->
    <line x1="74" y1="18" x2="74" y2="78" stroke="#00F2FE" stroke-width="3" stroke-linecap="round"/>

    <!-- Dynamic Audio Wave Bars rising from the book -->
    <line x1="28" y1="48" x2="28" y2="30" stroke="#00F2FE" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="42" y1="52" x2="42" y2="20" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="56" y1="56" x2="56" y2="10" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round"/>

    <line x1="92" y1="56" x2="92" y2="10" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="106" y1="52" x2="106" y2="20" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="120" y1="48" x2="120" y2="30" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(245, 95)">
    <!-- Project Title -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">
      audiobook<tspan fill="url(#audio-wave-grad)">-tts</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.02em">
      Heterogeneous Multi-Device Streaming Audiobook Studio
    </text>
  </g>

  <!-- Hardware Accelerator Badges (Graphic element right side) -->
  <g transform="translate(710, 68)">
    <!-- GPU 1 Badge -->
    <rect x="0" y="0" width="105" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#10B981"/>
    <text x="22" y="16" font-family="monospace" font-size="10" font-weight="600" fill="#94A3B8">CUDA : 5070 Ti</text>

    <!-- GPU 2 Badge -->
    <rect x="0" y="32" width="105" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="12" cy="44" r="3.5" fill="#3B82F6"/>
    <text x="22" y="48" font-family="monospace" font-size="10" font-weight="600" fill="#94A3B8">CUDA : 4070 Ti</text>

    <!-- CPU Badge -->
    <rect x="0" y="64" width="105" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="12" cy="76" r="3.5" fill="#A855F7"/>
    <text x="22" y="80" font-family="monospace" font-size="10" font-weight="600" fill="#94A3B8">HOST CPU : 20C</text>
  </g>
</svg>
