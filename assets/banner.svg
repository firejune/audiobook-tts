<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <!-- Background dark obsidian gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="50%" stop-color="#070910"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <!-- Refined Electric Cyan-to-Indigo Spectrum -->
    <linearGradient id="sonic-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="sonic-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Warm Amber accent for voice node -->
    <linearGradient id="voice-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambient-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
    </filter>

    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="880" height="240" rx="18" fill="url(#banner-bg)" stroke="#1a202c" stroke-width="1.2"/>

  <!-- Subtle ambient backlights -->
  <circle cx="140" cy="120" r="75" fill="#6366F1" opacity="0.12" filter="url(#ambient-glow)"/>
  <circle cx="165" cy="120" r="50" fill="#38BDF8" opacity="0.08" filter="url(#ambient-glow)"/>

  <!-- Left: Precision Geometric Sonic Emblem -->
  <!-- Concentric harmonic arcs representing an acoustic waveguide & continuous narration loop -->
  <g transform="translate(62, 42)">
    <!-- Outer Arc (Radius 78, 220 deg sweep) -->
    <path d="M 78 0 A 78 78 0 1 0 78 156" fill="none" stroke="url(#sonic-grad-1)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Middle Echo Arc (Radius 56, 180 deg sweep) -->
    <path d="M 78 22 A 56 56 0 1 0 78 134" fill="none" stroke="url(#sonic-grad-2)" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 8"/>

    <!-- Inner Focus Arc (Radius 36, 160 deg sweep) -->
    <path d="M 78 42 A 36 36 0 1 0 78 114" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

    <!-- Center Sonic Waveform Core (Geometric Sound Bars) -->
    <g transform="translate(78, 78)" filter="url(#node-glow)">
      <!-- Central focal node -->
      <circle cx="0" cy="0" r="6" fill="url(#voice-core-grad)"/>

      <!-- Vertical Harmonic Pulses -->
      <line x1="-14" y1="-12" x2="-14" y2="12" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-28" y1="-6"  x2="-28" y2="6"  stroke="#64748B" stroke-width="3"   stroke-linecap="round"/>
      <line x1="14"  y1="-18" x2="14"  y2="18" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="28"  y1="-24" x2="28"  y2="24" stroke="url(#sonic-grad-1)" stroke-width="4" stroke-linecap="round"/>
      <line x1="42"  y1="-14" x2="42"  y2="14" stroke="#A855F7" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="56"  y1="-6"  x2="56"  y2="6"  stroke="#64748B" stroke-width="3"   stroke-linecap="round"/>
    </g>
  </g>

  <!-- Typography & Features (Rigc Style alignment) -->
  <g transform="translate(258, 0)">
    <!-- Main Title -->
    <text x="0" y="104" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      <tspan fill="url(#text-grad)">audiobook</tspan><tspan fill="url(#sonic-grad-1)">-tts</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="142" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="-0.2">
      Streaming multi-device audiobook generator &amp; continuous narration studio
    </text>

    <!-- Clean Badges (Horizontal Inline Layout) -->
    <g transform="translate(2, 166)">
      <!-- Badge 1: Real-time Streaming -->
      <rect x="0" y="0" width="140" height="26" rx="6" fill="#131826" stroke="#1e293b" stroke-width="1"/>
      <text x="70" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">⚡ STREAMING SSE</text>

      <!-- Badge 2: Multi-Device -->
      <rect x="148" y="0" width="168" height="26" rx="6" fill="#131826" stroke="#1e293b" stroke-width="1"/>
      <text x="232" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#A855F7" text-anchor="middle">🌐 HETEROGENEOUS POOL</text>

      <!-- Badge 3: Zero-Build Studio -->
      <rect x="324" y="0" width="160" height="26" rx="6" fill="#131826" stroke="#1e293b" stroke-width="1"/>
      <text x="404" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">📖 ZERO-BUILD STUDIO</text>
    </g>
  </g>
</svg>
