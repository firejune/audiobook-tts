[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-tts"
version = "0.1.0"
description = "Heterogeneous multi-device streaming audiobook generator and studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Junho Ahn", email = "firejune@gmail.com" }]
keywords = [
  "audiobook",
  "tts",
  "text-to-speech",
  "streaming",
  "multi-gpu",
  "qwen",
  "deep-learning",
  "voice-studio",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pydantic>=2.0",
  "transformers>=4.48.0",
  "accelerate>=0.28.0",
  "soundfile>=0.12.0",
  "torchaudio",
  "numpy",
  "einops",
  "onnxruntime",
]

[project.urls]
Homepage = "https://github.com/firejune/audiobook-tts"
Repository = "https://github.com/firejune/audiobook-tts.git"
Issues = "https://github.com/firejune/audiobook-tts/issues"

[project.scripts]
audiobook-tts = "audiobook_tts.server:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["audiobook_tts*", "qwen_tts*"] } }
include-package-data = true

[tool.setuptools.package-data]
qwen_tts = ["py.typed", "**/*.npz"]
web = ["*"]
